plugins {
    id 'java-library'
    id 'application'
}

group = 'io.github.agentcheck'
version = '0.3.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    compileOnly platform('org.springframework.ai:spring-ai-bom:2.0.1')
    compileOnly 'org.springframework.ai:spring-ai-client-chat'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    testImplementation 'org.springframework.ai:spring-ai-client-chat'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.agentcheck.example.CustomerSupportExample'
}

tasks.named('test') {
    useJUnitPlatform()
}
