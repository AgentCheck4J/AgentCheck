plugins {
    id 'base'
}

group = 'io.github.agentcheck4j'
version = '0.5.0'

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        tasks.withType(JavaExec).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

tasks.named('clean') {
    dependsOn ':agentcheck-core:clean', ':agentcheck-examples:clean', ':agentcheck-mcp:clean',
            ':agentcheck-spring-ai:clean'
}

tasks.named('check') {
    dependsOn ':agentcheck-core:check', ':agentcheck-examples:check', ':agentcheck-mcp:check',
            ':agentcheck-spring-ai:check', 'consumerSmokeTest'
}

tasks.named('build') {
    dependsOn ':agentcheck-core:build', ':agentcheck-examples:build', ':agentcheck-mcp:build',
            ':agentcheck-spring-ai:build'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs tests in all AgentCheck modules.'
    dependsOn ':agentcheck-core:test', ':agentcheck-examples:test', ':agentcheck-mcp:test',
            ':agentcheck-spring-ai:test', 'consumerSmokeTest'
}

tasks.register('publishForConsumerTests') {
    group = 'publishing'
    description = 'Publishes AgentCheck libraries to the isolated consumer-test repository.'
    dependsOn ':agentcheck-core:publishMavenJavaPublicationToConsumerTestRepository',
            ':agentcheck-mcp:publishMavenJavaPublicationToConsumerTestRepository',
            ':agentcheck-spring-ai:publishMavenJavaPublicationToConsumerTestRepository'
}

tasks.register('consumerSmokeTest', GradleBuild) {
    group = 'verification'
    description = 'Tests the published POMs from independent consumer projects.'
    dependsOn 'publishForConsumerTests'
    dir = file('consumer-smoke-tests')
    tasks = ['clean', 'runAll']
    startParameter.projectProperties = [
            agentCheckRepository: layout.buildDirectory.dir('consumer-test-repository').get().asFile.absolutePath,
            agentCheckVersion: project.version.toString()
    ]
}

tasks.register('run') {
    group = 'application'
    description = 'Runs the deterministic customer-support example.'
    dependsOn ':agentcheck-examples:run'
}

tasks.register('recordExample') {
    group = 'application'
    description = 'Records a disabled customer-support golden-test draft.'
    dependsOn ':agentcheck-examples:recordExample'
}

tasks.register('mcpExample') {
    group = 'application'
    description = 'Runs the deterministic MCP mapping example.'
    dependsOn ':agentcheck-examples:mcpExample'
}
