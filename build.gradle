plugins {
    id 'base'
}

group = 'io.github.agentcheck4j'
version = '0.5.0-SNAPSHOT'

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        tasks.withType(JavaExec).configureEach {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

tasks.named('clean') {
    dependsOn ':agentcheck-core:clean', ':agentcheck-spring-ai:clean'
}

tasks.named('check') {
    dependsOn ':agentcheck-core:check', ':agentcheck-spring-ai:check'
}

tasks.named('build') {
    dependsOn ':agentcheck-core:build', ':agentcheck-spring-ai:build'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs tests in all AgentCheck modules.'
    dependsOn ':agentcheck-core:test', ':agentcheck-spring-ai:test'
}

tasks.register('run') {
    group = 'application'
    description = 'Runs the deterministic customer-support example.'
    dependsOn ':agentcheck-core:run'
}

tasks.register('recordExample') {
    group = 'application'
    description = 'Records a disabled customer-support golden-test draft.'
    dependsOn ':agentcheck-core:recordExample'
}
