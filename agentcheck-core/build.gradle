plugins {
    id 'java-library'
    id 'application'
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.agentcheck.example.CustomerSupportExample'
}

tasks.named('run', JavaExec) {
    workingDir = rootProject.projectDir
}

tasks.register('recordExample', JavaExec) {
    group = 'application'
    description = 'Records a disabled customer-support golden-test draft.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.agentcheck.example.GoldenRecordingExample'
    workingDir = rootProject.projectDir
}
